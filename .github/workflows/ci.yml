name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # Only upstream runs CI; deploy-button copies build on Cloudflare instead.
    if: github.repository == 'sarequl/clientflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
