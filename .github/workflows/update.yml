# Keeps a "Deploy to Cloudflare" copy of Clientflare current with upstream.
#
# Cloudflare's deploy button copies this repo into your GitHub account (and
# strips .github, so this file arrives with the first manual update). It runs
# scripts/update-from-upstream.sh and pushes; the push triggers Cloudflare's
# build, which runs the database migrations.
#
# Run it from the Actions tab ("Update from upstream" → "Run workflow"), or let
# the weekly schedule do it. Real merge conflicts fail the run; merge by hand.
name: Update from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC

permissions:
  contents: write

jobs:
  update:
    # No-op in the upstream repo itself.
    if: github.repository != 'sarequl/clientflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git config user.name "clientflare-update"
          git config user.email "noreply@users.noreply.github.com"
          sh scripts/update-from-upstream.sh
      - name: Push
        run: git push origin HEAD:main
